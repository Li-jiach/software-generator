function ragAnswer(question,scope='project'){let available=ragSources();if(scope==='history')for(const p of data.projects.filter(canView).filter(p=>p.id!==data.currentId)){for(const f of p.files.filter(f=>f.text))available.push({file:f,text:f.text,scope:p.id,version:f.version})}const q=question.trim().toLowerCase();const terms=[...new Set((q.match(/[\u4e00-\u9fa5]{2,}|[A-Za-z.0-9]+/g)||[]).flatMap(x=>x.length>3?[x,...Array.from({length:x.length-1},(_,i)=>x.slice(i,i+2))]:[x]))].filter(w=>w.length>1&&!['什么','如何','已有','哪些','相关','这个','系统','我们','请问','请说','的功能','软件','信息'].includes(w));let scored=available.map(d=>{let score=terms.reduce((n,t)=>n+((d.text.toLowerCase().includes(t)?1:0)+(d.file.name.toLowerCase().includes(t)?2:0)),0);return {...d,score}}).sort((a,b)=>b.score-a.score).filter(x=>x.score>0);if(!scored.length)return {answer:'在当前授权资料中未检索到足以支撑回答的内容。建议上传相关材料或换一种提问方式。\n\n（演示模式：使用本地文本匹配，不调用真实 Embedding、Reranker 或大模型。）',citations:[]};let sources=scored.slice(0,3);let text=sources.map((s,i)=>`【来源 ${i+1}】${s.file.name}${s.scope!==project().id?'（历史项目）':''}\n${s.text.slice(0,200)}${s.text.length>200?'…':''}`).join('\n\n');return {answer:`基于 ${sources.length} 份授权材料，检索到以下可核对的信息：\n\n${text}\n\n以上是材料片段摘取而非生成式推理；请点击引用来源查看原文。`,citations:sources.map(s=>({id:s.file.id,name:s.file.name,scope:s.scope}))}}

 const groupCards=Object.keys(GROUPS).map(g=>{const fs=FIELDS.filter(f=>f.group===g);const filled=fs.filter(f=>String(p.form?.[f.id]??'').trim()).length;return `<section class="panel basic-group"><div class="panel-header"><div><h3 class="panel-title">${esc(GROUPS[g])}</h3><div class="panel-sub">${filled} / ${fs.length} 项已填写</div></div>${badge(g==='basic'?'行政业务办':'研发中心','info')}</div><div class="panel-body"><div class="form-fields">${fs.map(renderField).join('')}</div></div></section>`}).join('');
 const reviewed=Object.values(p.formReviews||{}).filter(x=>x.status==='approved').length;
 const reviewPanel=data.role==='admin'?panel('管理员核实','仅在部门提交后进行核验；可逐项通过或退回',`<div class="table-scroll"><table class="data-table"><thead><tr><th>申报字段</th><th>当前内容</th><th>填写部门</th><th>核验状态</th><th>操作</th></tr></thead><tbody>${FIELDS.map(f=>{const rv=p.formReviews?.[f.id]||{};return `<tr><td><strong>${esc(f.label)}</strong></td><td style="max-width:230px"><span style="display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.form[f.id]||'—')}</span></td><td>${f.dept==='research'?'研发中心':'行政业务办'}</td><td>${badge(rv.status==='approved'?'已通过':rv.status==='returned'?'已退回':'待核实',rv.status==='approved'?'positive':rv.status==='returned'?'negative':'warning')}</td><td>${p.formStatus==='submitted'||p.formStatus==='returned'?`<div class="actions">${btn('通过','fieldApprove','soft',`data-id="${f.id}"`,'check')}${btn('退回','fieldReject','default',`data-id="${f.id}"`,'edit')}</div>`:'<span class="muted tiny">等待部门提交</span>'}</td></tr>`}).join('')}</tbody></table></div><div class="panel-body"><div class="actions">${btn('批量核实全部已填字段','approveAllFields','primary','','check')}</div></div>`):panel('填报与核实状态','提交后由管理员统一核验',`<div class="panel-body"><div class="alert">${icon('shield',17)}<span>当前账号按部门权限填写对应字段。其他部门字段只读；提交后由管理员核实。</span></div><div class="review-row"><div><strong>已核实字段</strong><div class="value">${reviewed} / ${FIELDS.length}</div></div>${badge('管理员核验','info')}</div></div>`);
 const proofCount=p.files.filter(f=>['权属材料','申请表','生成成果'].includes(f.type)).length;
 return header('基础信息填报','一次性填写软件申请、开发环境和功能特点；部门协作完成后提交管理员核实。',`${btn('检查完整性','validateForm','default','','shield')}${btn('保存草稿','saveForm','soft','','check')}${btn('提交管理员核实','submitForm','primary','','send')}`)+projectHead()+
 `<div class="grid grid-3 basic-summary"><div class="panel stat"><div class="stat-top">必填完成度<span class="stat-icon">${icon('check',17)}</span></div><div class="stat-value">${pr.pct}%</div><div class="metric-progress" style="width:100%;height:7px;margin-top:10px"><b style="width:${pr.pct}%"></b></div></div><div class="panel stat"><div class="stat-top">字段核验状态<span class="stat-icon">${icon('shield',17)}</span></div><div style="margin-top:18px">${badge(p.formStatus==='approved'?'已核实':p.formStatus==='submitted'?'待管理员审核':p.formStatus==='returned'?'退回修改':'草稿',p.formStatus==='approved'?'positive':p.formStatus==='returned'?'negative':'warning')}</div><div class="stat-meta">已核实 ${reviewed} 项</div></div><div class="panel stat"><div class="stat-top">关联材料<span class="stat-icon">${icon('folder',17)}</span></div><div class="stat-value">${proofCount}</div><div class="stat-meta">申请附件、权属材料及生成成果</div></div></div>
 ${missing.length?`<div class="alert amber" style="margin-bottom:16px">${icon('alert',18)}<span>还有 ${missing.length} 个必填项未填写：${missing.slice(0,8).map(f=>esc(f.label)).join('、')}${missing.length>8?'等':''}</span></div>`:`<div class="alert green" style="margin-bottom:16px">${icon('check',18)}<span>必填字段已填写完整。请保存并提交管理员核实。</span></div>`}
 <div class="basic-groups">${groupCards}</div><div class="space"></div>
 ${panel('申报附件关联',`当前项目已有 ${p.files.length} 份附件；无需重复上传`,`<div class="panel-body"><div class="review-row"><div><strong>权属及申请附件</strong><div class="value">${p.files.filter(f=>['权属材料','申请表'].includes(f.type)).length} 份</div></div>${badge(p.files.some(f=>['权属材料','申请表'].includes(f.type))?'已关联':'待补充',p.files.some(f=>['权属材料','申请表'].includes(f.type))?'positive':'warning')}</div><div class="review-row"><div><strong>操作手册</strong><div class="value">${p.manual.chapters.length?`已生成 v${p.manual.version}`:'尚未生成'}</div></div>${badge(p.manual.status==='approved'?'已核实':'待生成或审核',p.manual.status==='approved'?'positive':'warning')}</div><div class="actions" style="margin-top:14px">${btn('查看项目附件','go','default','data-route="attachments"','folder')}${btn('进入操作手册生成','go','soft','data-route="manual"','book')}</div></div>`)}
 <div class="space"></div>${reviewPanel}`;
}
function formView(group){const p=project();const pr=formProgress(p);const title=GROUPS[group];const fields=FIELDS.filter(f=>f.group===group);const missing=fields.filter(f=>f.required&&!String(p.form[f.id]??'').trim());const num=fields.filter(f=>!!String(p.form[f.id]??'').trim()).length;const canWrite=fields.some(canEditField);return header(title,`依据软著申请字段模板，由各部门分别填写、管理员核实。已核实字段修改后自动失效。`,`${btn('检查完整性','validateForm','default','','shield')}${btn('保存草稿','saveForm','soft','','check')}${btn('提交管理员核实','submitForm','primary','','send')}`)+projectHead()+`<div class="grid grid-3" style="margin-bottom:18px"><div class="panel stat"><div class="stat-top">本组已填写<span class="stat-icon">${icon('file',17)}</span></div><div class="stat-value">${num}<span class="muted" style="font-size:13px"> / ${fields.length}</span></div><div class="stat-meta">${esc(title)}</div></div><div class="panel stat"><div class="stat-top">全部必填完整度<span class="stat-icon">${icon('check',17)}</span></div><div class="stat-value">${pr.pct}%</div><div class="metric-progress" style="width:100%;height:7px;margin-top:10px"><b style="width:${pr.pct}%"></b></div></div><div class="panel stat"><div class="stat-top">审核状态<span class="stat-icon">${icon('shield',17)}</span></div><div style="margin-top:22px">${badge(p.formStatus==='approved'?'已核实':p.formStatus==='submitted'?'审核中':p.formStatus==='returned'?'已退回':'草稿',p.formStatus==='approved'?'positive':p.formStatus==='returned'?'negative':'warning')}</div><div class="stat-meta">修改已核实字段会重新进入草稿</div></div></div><div class="form-layout"><div>${panel('表单填写',`${fields.length} 项字段 · ${canWrite?'当前角色具有本组编辑权限':'仅可查看，当前角色无本组编辑权限'}`,`<div class="form-fields">${fields.map(renderField).join('')}</div><div class="form-footer"><span class="muted sm">${missing.length?`本组还有 ${missing.length} 个必填项未填写`:'本组必填信息齐全'} · 修改自动保存到本地草稿</span><div class="actions">${btn('保存','saveForm','soft','','check')}${btn('下一组','go','default',`data-route="${group==='basic'?'environment':group==='environment'?'features':'proofs'}"`,'arrow')}</div></div>`)}</div><div>${panel('填写与核实说明','清晰分工，避免数据被无声修改',`<div class="panel-body"><div class="alert">${icon('info',17)}<span>${group==='basic'?'此组属于行政业务办。软件名称、著作权人与权利取得方式等须核实原始凭据。':group==='environment'?'此组属于研发中心。硬件、IDE、语言及运行环境应来自真实项目，而不是原始模板示例。':'此组属于研发中心。主要功能、技术特点及源程序量须与源码及最终操作手册一致。'}</span></div><div style="height:14px"></div><div class="review-row"><div><strong>已填字段</strong><div class="value">${num} / ${fields.length}</div></div>${badge('草稿实时记录','info')}</div><div class="review-row"><div><strong>当前负责人</strong><div class="value">${group==='basic'?'行政业务办':'研发中心'}</div></div>${badge(data.role==='admin'?'管理员':data.role==='adminDept'?'行政业务办':'研发中心','neutral')}</div><div class="review-row"><div><strong>操作手册</strong><div class="value">系统材料完成状态的必要条件</div></div>${badge(p.manual.status==='approved'?'已审核':'尚未审核',p.manual.status==='approved'?'positive':'warning')}</div><div style="height:16px"></div>${p.formStatus==='submitted'?`<div class="alert amber">${icon('clock',17)}<span>表单审核中，暂不可编辑。管理员审核退回后才可继续修改。</span></div>`:missing.length?`<div class="alert amber">${icon('alert',17)}<span>本组未完成：${missing.map(x=>x.label).join('、')}</span></div>`:`<div class="alert green">${icon('check',17)}<span>本组必填项已填写，可继续进行跨部门核验。</span></div>`}</div>`)}<div class="space"></div>${panel('协作与审查记录','最近字段变动及管理员动作',`<div class="panel-body">${p.activity.filter(x=>/填报|字段|审核/.test(x.title)).slice(0,5).map(a=>`<div class="timeline-item"><span class="timeline-point">${icon('clock',12)}</span><div class="timeline-content"><strong>${esc(a.title)}</strong><p>${esc(a.detail)}</p><small>${esc(a.time)}</small></div></div>`).join('')||'<div class="muted sm">暂无字段审核记录。</div>'}</div>`)}</div></div>`}
function proofs(){const p=project();const assoc=[['权属/身份证明','权属材料',p.files.filter(f=>f.type==='权属材料')],['申请信息与辅助附件','申请表',p.files.filter(f=>f.type==='申请表')],['程序鉴别材料','source_doc',p.files.filter(f=>f.type==='生成成果'&&f.name.includes('源程序'))],['操作手册','manual',p.files.filter(f=>f.type==='生成成果'&&f.name.includes('操作手册'))]];return header('证明材料关联','关联现有附件、程序鉴别材料和操作手册，保持审核版本的一致性。',btn('上传证明附件','triggerUpload','primary','','upload'))+projectHead()+`<div class="grid grid-2">${panel('申报材料对照','所有材料与当前项目关联，无需重复上传',`<div class="panel-body">${assoc.map(([name,type,files])=>`<div class="review-row"><div><strong>${esc(name)}</strong><div class="value">${files.length?esc(files.map(f=>f.name).join(' / ')):'尚未关联相应文件'}</div></div><div class="actions">${badge(files.length?'已关联':'待补充',files.length?'positive':'warning')}${btn('查看','go','default',`data-route="${type==='manual'?'manual':type==='source_doc'?'export':'attachments'}"`,'arrow')}</div></div>`).join('')}<div style="height:14px"></div>${btn('前往操作手册生成','go','soft','data-route="manual"','book')}</div>`)}${panel('项目材料完成判定','两个核实条件缺一不可',`<div class="panel-body"><div class="phase ${p.formStatus==='approved'?'done':''}"><div class="phase-number">${icon(p.formStatus==='approved'?'check':'clock',15)}</div><div style="flex:1"><strong>人工信息填报已核实</strong><small>管理员已核实当前表单版本</small></div>${badge(p.formStatus==='approved'?'通过':'未通过',p.formStatus==='approved'?'positive':'warning')}</div><div style="height:9px"></div><div class="phase ${p.manual.status==='approved'?'done':''}"><div class="phase-number">${icon(p.manual.status==='approved'?'check':'clock',15)}</div><div style="flex:1"><strong>操作手册已核实</strong><small>已有冻结的已审核版本</small></div>${badge(p.manual.status==='approved'?'通过':'未通过',p.manual.status==='approved'?'positive':'warning')}</div><div style="height:17px"></div><div class="alert ${materialsComplete(p)?'green':'amber'}">${icon(materialsComplete(p)?'check':'alert',19)}<span><strong>${materialsComplete(p)?'材料已完成':'材料未完成'}</strong><br>${materialsComplete(p)?'可以进入官网申报预检。':'即使所有人工字段都填完，只要没有已核实操作手册，材料仍视为未完成。'}</span></div></div>`)}</div>`}
function reviews(){const p=project();const count=Object.values(p.formReviews||{}).filter(r=>r.status==='approved').length;return header('审核记录与核验','管理员核实全部申报字段并查看修订记录；部门人员可查看退回意见。',`${data.role==='admin'?btn('批量通过已填字段','approveAllFields','soft','','check'):''}${btn('提交管理员核实','submitForm','primary','','send')}`)+projectHead()+`<div class="grid grid-3" style="margin-bottom:18px"><div class="panel stat"><div class="stat-top">字段总数<span class="stat-icon">${icon('file',17)}</span></div><div class="stat-value">${FIELDS.length}</div><div class="stat-meta">按原始填报模板拆分</div></div><div class="panel stat"><div class="stat-top">已核实字段<span class="stat-icon">${icon('shield',17)}</span></div><div class="stat-value">${count}</div><div class="stat-meta">管理员逐项审核留痕</div></div><div class="panel stat"><div class="stat-top">当前审核状态<span class="stat-icon">${icon('clock',17)}</span></div><div style="margin-top:19px">${badge(p.formStatus==='approved'?'已核实':p.formStatus==='submitted'?'待审核':p.formStatus==='returned'?'退回修改':'草稿',p.formStatus==='approved'?'positive':'warning')}</div></div></div><div class="split"><div>${panel('逐字段核验列表','管理员可以逐项通过 / 退回；核实后如有修改自动失效',`<div class="table-scroll"><table class="data-table"><thead><tr><th>字段</th><th>填写内容（摘要）</th><th>填报部门</th><th>核验状态</th><th>操作</th></tr></thead><tbody>${FIELDS.map(f=>{const rv=p.formReviews[f.id]||{};return `<tr><td><strong>${esc(f.label)}</strong></td><td style="max-width:210px"><span style="display:block;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.form[f.id]||'—')}</span></td><td>${f.dept==='research'?'研发中心':'行政业务办'}</td><td>${badge(rv.status==='approved'?'已通过':rv.status==='returned'?'已退回':'待核实',rv.status==='approved'?'positive':rv.status==='returned'?'negative':'warning')}</td><td>${data.role==='admin'?`<div class="actions">${btn('通过','fieldApprove','soft',`data-id="${f.id}"`,'check')}${btn('退回','fieldReject','default',`data-id="${f.id}"`,'edit')}</div>`:'<span class="muted tiny">仅管理员可核验</span>'}</td></tr>`}).join('')}</tbody></table></div>`)}<div class="space"></div>${panel('审核动作记录','字段变化保留独立审核事件',`<div class="panel-body">${p.activity.filter(x=>/审核|核实|退回|字段/.test(x.title)).slice(0,8).map(x=>`<div class="timeline-item"><span class="timeline-point">${icon('clock',12)}</span><div class="timeline-content"><strong>${esc(x.title)}</strong><p>${esc(x.detail)}</p><small>${esc(x.time)}</small></div></div>`).join('')||'<div class="muted sm">暂无审核动作。</div>'}</div>`)}</div><div>${panel('审核规则与权限','需人工确认真实业务字段',`<div class="panel-body"><div class="alert ${data.role==='admin'?'green':'amber'}">${icon('shield',18)}<span>${data.role==='admin'?'当前为管理员演示身份，可逐字段核实。':'当前为部门人员演示身份，仅可查看审核结果，不可替代管理员核实。'}</span></div><div style="margin-top:17px" class="timeline-item"><span class="timeline-point">${icon('edit',12)}</span><div class="timeline-content"><strong>部门填写与提交</strong><p>行政与研发按字段组协作，管理员审核前锁定提交版本。</p></div></div><div class="timeline-item"><span class="timeline-point">${icon('check',12)}</span><div class="timeline-content"><strong>管理员逐项核实</strong><p>全部必填字段经过审核才能核实整张表单。</p></div></div><div class="timeline-item"><span class="timeline-point">${icon('refresh',12)}</span><div class="timeline-content"><strong>已核实内容修改失效</strong><p>任何经批准数据被编辑都会触发重新审核。</p></div></div><div style="margin-top:13px">${btn('查看字段填写','go','soft','data-route="basic"','arrow')}</div></div>`)}</div></div>`}

function manualWorkflowNav(active){const steps=[['source','01','导入源码'],['analysis','02','智能分析'],['manual','03','编辑操作手册'],['export','04','导出材料']];return `<div class="manual-workflow-nav">${steps.map(([r,n,t],i)=>`<button class="manual-workflow-step ${active===r?'active':VALID_ROUTES.includes(active)&&steps.findIndex(x=>x[0]===active)>i?'done':''}" data-action="go" data-route="${r}"><span class="step-no">${n}</span><span>${t}</span></button>${i<steps.length-1?`<span class="step-connector"></span>`:''}`).join('')}</div>`}

sc(p.source.branch||'main')} · ${esc(p.version)}</div></div></div><div class="review-row"><div><strong>快照标识</strong><div class="value">${esc(p.source.hash||'尚未计算')}</div></div></div><div class="review-row"><div><strong>分析状态</strong><div class="value">${esc(p.analysis.status==='idle'?'未开始':p.analysis.status==='running'?'进行中':p.analysis.status==='completed'?'已完成':p.analysis.status)}</div></div>${badge(p.analysis.status==='completed'?'已完成':'待解析',p.analysis.status==='completed'?'positive':'warning')}</div><div style="height:16px"></div><div class="alert">${icon('shield',18)}<span>正式环境将计算 Git SHA 与文件 SHA-256、写入 manifest 并隔离解析；本页仅模拟部分校验和流程状态。</span></div></div>`)}<div class="space"></div></div></div>`}
const STAGES=[['冻结源码与安全检查','快照清点 / 过滤敏感和依赖文件'],['工程拓扑识别','识别前端、C#、Python 入口和技术栈'],['前端菜单与事件读取','路由、菜单、按钮、表单及交互入口'],['业务后端服务读取','API、权限校验、状态变化、数据模型'],['Python 智能体接口读取','FastAPI 路由、工具链、模型与异步任务'],['功能与源码证据关联','菜单→页面→接口→服务→证据片段'],['操作路径与截图待核验','实际界面截图可由业务人员补充'],['生成章节目录与质量检查','形成分级功能树及缺证提示']];
const AGENTS=[['调度 Agent','阶段任务拆分、重试及证据整合','layers'],['仓库清点 Agent','语言检测、目录结构和排除规则','folder'],['前端解析 Agent','菜单、控件、页面交互与路由','layout'],['后端解析 Agent','控制器、服务、DTO、权限校验','terminal'],['Python 服务 Agent','智能体、FastAPI、工作流依赖','brain'],['证据关联 Agent','关联 UI、API、代码文件行号','link'],['手册编写 Agent','目录、操作步骤、图文说明','book'],['质量核验 Agent','缺证、逻辑冲突、敏感信息核查','shield'],['官网执行 Agent','已核实材料到 RPA 工作流','globe']];
function analysis(){
  const p=project(),a=p.analysis, progress=Math.round((a.step||0)/STAGES.length*100);
  const phases=STAGES.map(([label,desc],i)=>`<div class="phase ${a.step>i?'done':a.step===i&&a.status==='running'?'running':''}"><span class="phase-number">${a.step>i?icon('check',15):String(i+1).padStart(2,'0')}</span><div style="flex:1"><strong>${esc(label)}</strong><small>${esc(desc)}</small></div>${a.step>i?badge('已完成','positive'):a.step===i&&a.status==='running'?badge('处理中','info'):badge('等待中','neutral')}</div>`).join('');
  const features=(a.features||[]).map(f=>`<div class="feature"><div style="min-width:0"><strong>${icon(f.type==='frontend'?'layout':f.type==='backend'?'terminal':'brain',14)} ${esc(f.name)}</strong><p>类型：${f.type==='frontend'?'前端交互':f.type==='backend'?'后端接口':'Python 接口'} · ${esc(f.path)}:${f.line}</p></div><div class="actions">${badge(f.status==='verified'?'人工已证':'源码可证 / 待实测',f.status==='verified'?'positive':'warning')}<button class="btn btn-sm" data-action="sourcePreview" data-path="${esc(f.path)}">${icon('code',13)}</button><button class="btn btn-sm ${f.status==='verified'?'':'btn-soft'}" data-action="verifyFeature" data-id="${f.id}">${icon('check',13)}</button></div></div>`).join('');
  const agents=AGENTS.map(([name,desc,ic])=>`<div class="agent-row"><span class="agent-bubble">${icon(ic,17)}</span><div><strong>${esc(name)}</strong><p>${esc(desc)}</p></div></div>`).join('');
  const heads=header('智能分析','九类智能体分阶段阅读项目源码；界面显示任务进度、证据关系与待核实项。',`${btn(a.status==='running'?'暂停任务':a.status==='paused'?'继续任务':'开始解析',a.status==='running'?'pauseAnalysis':a.status==='paused'?'resumeAnalysis':'startAnalysis','primary','',a.status==='running'?'pause':'play')}${btn('增量重跑','rerunAnalysis','soft','','refresh')}`);
  const summary=`<div class="grid grid-3" style="margin-bottom:18px"><div class="panel stat"><div class="stat-top">任务进度<span class="stat-icon">${icon('zap',17)}</span></div><div class="stat-value">${progress}%</div><div class="metric-progress" style="width:100%;height:7px;margin-top:10px"><b style="width:${progress}%"></b></div></div><div class="panel stat"><div class="stat-top">识别功能点<span class="stat-icon">${icon('layout',17)}</span></div><div class="stat-value">${a.features?.length||0}</div><div class="stat-meta">源码可证 ≠ 实际运行已验证</div></div><div class="panel stat"><div class="stat-top">待确认项<span class="stat-icon">${icon('alert',17)}</span></div><div class="stat-value">${a.features?.filter(f=>f.status!=='verified')?.length||0}</div><div class="stat-meta">需截图或实际操作证据</div></div></div>`;
  const processPanel=panel('分阶段解析工作流',`当前任务：${a.status==='running'?'运行中':a.status==='paused'?'已暂停':a.status==='completed'?'解析完成':'尚未开始'}`,`<div class="panel-body"><div class="phase-list">${phases}</div><div style="height:16px"></div><div class="alert amber">${icon('info',18)}<span>这是 JavaScript 模拟解析。正式系统由 Python FastAPI 队列与计算所本地模型执行实际源码分析。</span></div></div>`);
  const featurePanel=panel('解析形成的功能树',`共 ${a.features?.length||0} 个候选功能，点击查看证据`,`<div class="panel-body"><div class="feature-table">${features||'<div class="empty"><strong>等待源码解析</strong></div>'}</div><div style="margin-top:15px" class="actions">${btn('基于功能树生成手册目录','buildManual','primary','','book')}${btn('上传实际操作截图','uploadScreenshot','default','','image')}</div><input hidden type="file" id="analysisScreenshot" accept="image/*" /></div>`);
  const agentPanel=panel('智能体分工','分步骤控制上下文与证据质量',`<div class="panel-body" style="padding-top:7px">${agents}</div>`);
  const warnPanel=panel('已知风险与人工任务','不得把源码推断当作实际操作事实',`<div class="panel-body"><div class="alert amber">${icon('alert',18)}<span>${esc((a.warnings||[]).join('；')||'真实界面点击路径需要人工或受控浏览器实测验证。')}</span></div><div style="margin-top:15px">${btn('进入手册校对','go','soft','data-route="manual"','arrow')}</div></div>`);
  return heads+projectHead()+manualWorkflowNav('analysis')+summary+`<div class="split"><div>${processPanel}<div class="space"></div>${featurePanel}</div><div>${agentPanel}<div class="space"></div>${warnPanel}</div></div>`;
}

 else if(c)editorBody=`<div class="section-editor"><label>章节标题 · H${c.level}</label><input id="chapterTitle" value="${esc(c.title)}" ${canWrite?'':'disabled'}/><label>详细操作说明</label><textarea id="chapterBody" ${canWrite?'':'disabled'} placeholder="说明用途、前置条件、操作步骤和预期结果">${esc(c.body)}</textarea><div style="display:flex;justify-content:space-between;gap:8px;margin-top:10px"><span class="tiny muted">章节更改需重新审核</span>${badge(c.verified?'章节已确认':'操作待核实',c.verified?'positive':'warning')}</div></div>`;

function isExcludedPath(path){let parts=path.replace(/\\/g,'/').split('/');return parts.some(p=>['.git','node_modules','bin','obj','venv','.venv','.idea','.vs','dist','build','__pycache__','.next','.nuxt','coverage','packages'].includes(p))||/(^|\/)(\.env(?:\..*)?|id_rsa|id_ed25519|.*\.pem|.*\.p12|.*\.pfx|.*\.key|.*\.secrets?\..*|appsettings\.(?:prod|production)\.json)$/i.test(path)}
const textSourceExt=/\.(cs|cshtml|razor|py|js|jsx|ts|tsx|vue|html|css|scss|json|xml|yaml|yml|toml|ini|config|md|txt|sql|sln|csproj|props|targets|sh|bat|ps1|gradle|java|kt|go|rs|php|rb|swift|dart)$/i;
function safePath(path){return path&&!path.startsWith('/')&&!/^[a-zA-Z]:/.test(path)&&!path.replace(/\\/g,'/').split('/').includes('..')&&!path.includes('\0')}
function shaSimple(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')}
function zipReadU16(b,i){return b[i]|(b[i+1]<<8)}function zipReadU32(b,i){return (b[i]|b[i+1]<<8|b[i+2]<<16|b[i+3]<<24)>>>0}
async function readZipBytes(bytes,maxFiles=800){let b=new Uint8Array(bytes);let end=Math.max(0,b.length-65557),p=-1;for(let i=b.length-22;i>=end;i--)if(zipReadU32(b,i)===0x06054b50){p=i;break}if(p<0)throw new Error('ZIP 缺少中央目录，请检查压缩包格式。');let entries=zipReadU16(b,p+10),pos=zipReadU32(b,p+16);if(entries>maxFiles)throw new Error('ZIP 文件数量超出演示扫描上限');let out=[];let total=0;for(let i=0;i<entries;i++){if(zipReadU32(b,pos)!==0x02014b50)break;let method=zipReadU16(b,pos+10),size=zipReadU32(b,pos+20),raw=zipReadU32(b,pos+24),nlen=zipReadU16(b,pos+28),ex=zipReadU16(b,pos+30),com=zipReadU16(b,pos+32),offset=zipReadU32(b,pos+42);let path=new TextDecoder('utf-8').decode(b.slice(pos+46,pos+46+nlen));pos+=46+nlen+ex+com;if(!safePath(path)||isExcludedPath(path)||!textSourceExt.test(path)||path.endsWith('/'))continue;if(raw>2*1024*1024)continue;total+=raw;if(total>12*1024*1024)throw new Error('解压文本总量超过 12 MB 安全限额');if(zipReadU32(b,offset)!==0x04034b50)continue;let d=offset+30+zipReadU16(b,offset+26)+zipReadU16(b,offset+28);let payload=b.slice(d,d+size);let unpacked;if(method===0)unpacked=payload;else if(method===8){if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持 ZIP 解压，请改用「本地文件夹」导入。');let stream=new Blob([payload]).stream().pipeThrough(new DecompressionStream('deflate-raw'));unpacked=new Uint8Array(await new Response(stream).arrayBuffer())}else continue;if(unpacked.length>2*1024*1024)continue;out.push({path,bytes:unpacked})}return out}
async function parseDocx(buffer){try{const entries=await readZipBytes(buffer,350);let doc=entries.find(x=>x.path==='word/document.xml');if(!doc)return null;let xml=new TextDecoder().decode(doc.bytes);return xml.replace(/<w:tab[^>]*\/>/g,'\t').replace(/<w:br[^>]*\/>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').trim().slice(0,220000)}catch(e){console.warn('DOCX preview parse unavailable',e);return null}}
async function handleAttachments(fileList){const p=project();let accepted=0;for(const file of [...fileList].slice(0,35)){if(file.size>20*1024*1024){toast(file.name+' 超过20MB演示上限','error');continue}const id=uid();let text='';const ext=file.name.split('.').pop().toLowerCase();try{if(['txt','md','csv','json','xml'].includes(ext)&&file.size<2e6)text=(await file.text()).slice(0,150000);else if(ext==='docx'&&file.size<5e6)text=await parseDocx(await file.arrayBuffer())||''}catch{}let f={id,name:file.name,type:$('#attachmentType')?.value||'其他附件',size:file.size,version:1,uploaded:new Date().toISOString().slice(0,10),text};let existing=p.files.find(x=>x.name===f.name);if(existing){f.version=existing.version+1;f.previousId=existing.id}p.files.unshift(f);ephemeral.files[id]=URL.createObjectURL(file);accepted++}if(accepted){log(p,'附件已上传',`上传 ${accepted} 份附件；文本可被本地演示检索`);save();render();toast(`已导入 ${accepted} 份附件。`)}else toast('未发现可导入的文件。','error')}
async function handleSourceFiles(fileList,mode){const p=project();let files=[];let errors=[];if(mode==='zip'){const file=[...fileList][0];if(!file)return;if(file.size>45*1024*1024){toast('ZIP 超出45MB演示限制','error');return}try{const zip=await readZipBytes(await file.arrayBuffer());files=zip.map(x=>({path:x.path,content:new TextDecoder('utf-8').decode(x.bytes)}))}catch(e){toast('ZIP 读取失败：'+e.message,'error');return}p.source.name=file.name}else{let total=0;for(const f of [...fileList].slice(0,1200)){let path=f.webkitRelativePath||f.name;if(!safePath(path)||isExcludedPath(path)||!textSourceExt.test(path)||f.size>1.5e6)continue;total+=f.size;if(total>12*1024*1024){errors.push('文件内容超过 12MB，后续文件被跳过');break}try{files.push({path,content:await f.text()})}catch{errors.push(path)}}p.source.name=[...fileList][0]?.webkitRelativePath?.split('/')[0]||'本地源码'}if(!files.length){toast('未读取到可分析的文本源码，请检查格式和目录。','error');return}p.source.files=files;p.source.mode=mode;p.source.hash='DEMO-'+shaSimple(files.map(x=>x.path+shaSimple(x.content)).join('|'));p.source.imported=now();p.analysis={status:'idle',step:0,features:[],warnings:errors};log(p,'导入源码快照',`读取 ${files.length} 个文件；快照 ${p.source.hash}`);save();render();toast(`成功读取 ${files.length} 个源码文件。`)}
function inferFeatures(files){let feats=[],seen=new Set();const add=(name,type,path,line,route)=>{let key=name+'|'+type;if(seen.has(key)||feats.length>=90)return;seen.add(key);feats.push({id:uid(),name:name.slice(0,70),type,path,line,route:route||'',status:'code'})};for(const f of files.slice(0,1200)){let path=f.path;let lines=f.content.split(/\r?\n/);for(let i=0;i<Math.min(lines.length,1000);i++){let line=lines[i];if(/\.(tsx?|jsx?|vue|html|cshtml|razor)$/i.test(path)){let btns=[...line.matchAll(/<button\b[^>]*>([^<]{2,45})<\/button>/gi)].map(x=>x[1].trim());let labels=[...line.matchAll(/(?:title|label|name)\s*:\s*['"]([\u4e00-\u9fa5\w /-]{2,34})['"]/g)].map(x=>x[1]);for(const v of [...btns,...labels].slice(0,8))add(v,'frontend',path,i+1);let match=line.match(/(?:path|route)\s*[:=]\s*['"](\/[\w\-/{}]+)['"]/);if(match)add('路由 '+match[1],'frontend',path,i+1,match[1])}if(/\.cs$/i.test(path)){let match=line.match(/\[(?:HttpGet|HttpPost|HttpPut|HttpDelete|HttpPatch)(?:\("([^"]+)"\))?\]/);if(match)add('API '+(match[1]||'(默认路由)'),'backend',path,i+1,match[1]);let route=line.match(/Map(?:Get|Post|Put|Delete|Patch)\s*\(\s*"([^"]+)"/);if(route)add('API '+route[1],'backend',path,i+1,route[1])}if(/\.py$/i.test(path)){let match=line.match(/@(?:app|router)\.(?:get|post|put|delete|patch)\(\s*['"]([^'"]+)['"]/);if(match)add('Python '+match[1],'python',path,i+1,match[1])}}
}return feats}
function advanceAnalysis(){const p=project(),a=p.analysis;if(a.status!=='running')return;if(a.step<STAGES.length){a.step++;if(a.step===3)a.features=inferFeatures(p.source.files||[]);if(a.step===6){a.warnings=(a.warnings||[]).concat('源码无法自动证明真实界面点击路径，请人工补充操作截图。');}if(a.step>=STAGES.length){a.status='completed';if(!a.features.length)a.warnings.push('未定位明确的页面、路由或接口候选，请核实源码结构。');log(p,'源码分析完成',`识别 ${a.features.length} 个候选功能点`);toast('源码分阶段解析演示已完成。')}save();if(data.route==='analysis')render();if(a.status==='running')ephemeral.timer=setTimeout(advanceAnalysis,730)}}

function requireAdmin(){if(data.role!=='admin'){toast('该操作仅限管理员角色。请使用右上角切换演示身份。','error');return false}return true}

function validateFields(){const p=project();const missing=FIELDS.filter(f=>f.required&&!String(p.form?.[f.id]??'').trim());if(missing.length){openModal('表单完整性检查',`<div class="alert amber">${icon('alert',18)}<span>还有 ${missing.length} 个必填字段未填写。请按照角色权限分别补齐后再提交审核。</span></div><div style="height:13px"></div>${missing.map(f=>`<div class="review-row"><div><strong>${esc(f.label)}</strong><div class="value">${esc(f.dept==='research'?'研发中心':'行政业务办')}</div></div>${btn('去填写','go','soft',`data-route="${f.group}" btn-sm`,'arrow')}</div>`).join('')}`,btn('关闭','closeModal'));return false}toast('必填字段完整，仍需管理员逐项核实及操作手册审核。');return true}
function openProjectModal(p){let editing=!!p;openModal(editing?'编辑项目资料':'创建软著项目',`<div class="grid grid-2"><div class="field full"><label class="field-label">软件项目名称 <span class="required">*</span></label><input id="pName" placeholder="请输入完整软件名称" value="${esc(p?.name||'')}" /></div><div class="field"><label class="field-label">版本号 <span class="required">*</span></label><input id="pVersion" value="${esc(p?.version||'V1.0')}" /></div><div class="field"><label class="field-label">归属部门</label><select id="pDept"><option ${p?.dept==='行政业务办'?'selected':''}>行政业务办</option><option ${p?.dept==='研发中心'?'selected':''}>研发中心</option></select></div><div class="field"><label class="field-label">项目负责人</label><input id="pOwner" value="${esc(p?.owner||'')}" placeholder="负责人姓名"/></div><div class="field"><label class="field-label">访问范围</label><select id="pAccess"><option value="shared">两部门协作访问</option><option value="dept">仅归属部门</option></select></div><div class="field full"><label class="field-label">项目简介</label><textarea id="pDesc" rows="3">${esc(p?.description||'')}</textarea></div></div><div style="height:12px"></div><div class="alert">${icon('info',17)}<span>项目采用独立 project_id。软件名称与版本不是数据库主键；所有材料和审核版本关联唯一项目ID。</span></div>`,`${btn('取消','closeModal')}${btn(editing?'保存更新':'创建项目',editing?'saveProject':'createProject','primary',editing?`data-id="${p.id}"`:'' ,editing?'check':'plus')}`)}
function showNotifications(){const visible=data.projects.filter(canView);let tasks=[];for(const p of visible){if(p.formStatus==='submitted')tasks.push({name:p.name,desc:'人工填写等待管理员核实',r:'reviews'});if(p.manual.status==='submitted')tasks.push({name:p.name,desc:'操作手册等待管理员审核',r:'manual'});if(p.formStatus==='approved'&&p.manual.status!=='approved')tasks.push({name:p.name,desc:'填写已核实但仍缺已核实操作手册',r:'manual'});if(p.application.status==='waiting_verification')tasks.push({name:p.name,desc:'RPA 等待人工验证码接管',r:'rpa'});if(p.application.status==='waiting_final')tasks.push({name:p.name,desc:'RPA 等待最终人工提交确认',r:'rpa'})}openModal('当前工作待办',tasks.length?tasks.map(t=>`<div class="review-row"><div><strong>${esc(t.name)}</strong><div class="value">${esc(t.desc)}</div></div>${btn('前往处理','jumpTask','soft',`data-project="${visible.find(x=>x.name===t.name)?.id}" data-route="${t.r}" btn-sm`,'arrow')}</div>`).join(''):'<div class="empty">暂无需要处理的待办事项。</div>',btn('关闭','closeModal'))}
function openFileMore(id){const p=project(),f=p.files.find(x=>x.id===id);if(!f)return;openModal('文件版本与归类',`<div class="file-row">${fileIcon(f)}<div><strong>${esc(f.name)}</strong><div class="muted sm">版本 v${f.version} · ${fileDisplaySize(f.size)} · ${esc(f.uploaded)}</div></div></div><div style="height:18px"></div><div class="field"><label class="field-label">所属分类</label><select id="fileNewType">${['技术文档','规范材料','历史手册','权属材料','申请表','生成成果','其他附件'].map(x=>`<option ${f.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div style="height:16px"></div><div class="alert">${icon('info',17)}<span>新版本不会静默覆盖旧版。正式系统可同时维护文件哈希、上传人、权限和原件版本链。</span></div><input type="file" id="replaceFileInput" data-id="${f.id}" hidden/>`,`${btn('删除附件','deleteFile','danger',`data-id="${f.id}"`,'trash')}${btn('上传新版本','replaceFile','soft',`data-id="${f.id}"`,'upload')}${btn('保存分类','saveFileType','primary',`data-id="${f.id}"`,'check')}`)}

function chapterUploadScreenshot(file){if(project().manual.status==='submitted')return toast('手册审核中，不能上传新截图。','error');if(!file||!file.type.startsWith('image/'))return toast('请上传图片文件。','error');if(file.size>900000)return toast('演示截图请控制在900KB以内。','error');const c=currentChapter();if(!c)return;let fr=new FileReader();fr.onload=()=>{c.screenshot=fr.result;c.verified=false;updateManualStatus();log(project(),'章节操作截图已更新',c.title);save();render();toast('已添加截图，请核实截图与操作步骤一致。')};fr.readAsDataURL(file)}

case 'addChapter':if(p.manual.status==='submitted')return toast('手册审核中，不能新增章节。','error');openModal('新增操作手册章节',`<div class="field"><label class="field-label">标题</label><input id="newChapterTitle" placeholder="例如：4.2.1 项目创建" /></div><div class="field" style="margin-top:14px"><label class="field-label">章节层级</label><select id="newChapterLevel"><option value="1">一级章</option><option value="2" selected>二级标题</option><option value="3">三级标题</option></select></div>`,`${btn('取消','closeModal')}${btn('添加章节','confirmAddChapter','primary','','plus')}`);break;

case 'moveChapter':{if(p.manual.status==='submitted')return toast('手册审核中，不能移动章节。','error');chapterInputSave(true);let idx=p.manual.chapters.findIndex(c=>c.id===data.activeChapter),step=el.dataset.direction==='up'?-1:1,to=idx+step;if(idx<0||to<0||to>=p.manual.chapters.length)return;[p.manual.chapters[to],p.manual.chapters[idx]]=[p.manual.chapters[idx],p.manual.chapters[to]];updateManualStatus();save();render();break}
case 'deleteChapter':{if(p.manual.status==='submitted')return toast('手册审核中，不能删除章节。','error');if(!currentChapter())return;openModal('删除章节',`<div class="alert red">${icon('alert',17)}<span>确认移除章节「${esc(currentChapter().title)}」？操作将使当前手册审核失效。</span></div>`,`${btn('取消','closeModal')}${btn('确认删除','confirmDeleteChapter','danger','','trash')}`);break}
case 'confirmDeleteChapter':{p.manual.chapters=p.manual.chapters.filter(c=>c.id!==data.activeChapter);data.activeChapter=p.manual.chapters[0]?.id||'';updateManualStatus();log(p,'删除手册章节','用户删除章节');closeModal();save();render();break}
case 'uploadScreenshot':{const x=$('#chapterScreenshotInput')||$('#analysisScreenshot');if(!x){toast('请在手册编辑页面上传截图。');route('manual');return}x.click();break}
case 'toggleChapterVerified':{if(p.manual.status==='submitted')return toast('手册审核中，不能修改章节核实状态。','error');let c=currentChapter();if(!c)return;c.verified=!c.verified;updateManualStatus();log(p,'核实手册章节',`${c.title}: ${c.verified?'确认':'撤销确认'}`);save();render();break}
case 'submitManual':{chapterInputSave(true);if(!p.manual.chapters.length){toast('尚未形成手册章节。','error');break}if(p.manual.status==='approved'){toast('手册已核实，无需重复提交。','error');break}let unverified=p.manual.chapters.filter(c=>!c.verified);if(unverified.length){openModal('手册仍需人工核实',`<div class="alert amber">${icon('alert',18)}<span>还有 ${unverified.length} 节未人工核实。不能把未验证的实际操作直接当作已完成步骤。</span></div><div style="height:13px"></div>${unverified.slice(0,20).map(c=>`<div class="review-row"><div><strong>${esc(c.title)}</strong><div class="value">需核对正文 / 截图 / 源码证据</div></div>${btn('前往','jumpChapter','soft',`data-id="${c.id}" btn-sm`,'arrow')}</div>`).join('')}`,btn('关闭','closeModal'));break}p.manual.status='submitted';log(p,'操作手册已提交管理员审核',`版本 v${p.manual.version}`);save();render();toast('手册已进入管理员审核。');break}
case 'jumpChapter':closeModal();data.activeChapter=id;route('manual');break;
case 'approveManual':{if(!requireAdmin())break;if(p.manual.status!=='submitted')return toast('只有提交审核的手册才能批准。','error');if(p.manual.chapters.some(c=>!c.verified))return toast('仍有未核实章节，不能审核通过。','error');p.manual.status='approved';p.manual.approvedAt=now();log(p,'管理员核实操作手册',`冻结 v${p.manual.version}`);save();render();toast('操作手册已审核通过，材料完成状态将自动更新。');break}
case 'rejectManual':{if(!requireAdmin())break;openModal('退回操作手册',`<div class="field"><label class="field-label">审核退回原因</label><textarea id="manualRejectReason" rows="4" placeholder="例如：需要补充实际操作截图及按钮反馈"></textarea></div>`,`${btn('取消','closeModal')}${btn('确认退回','confirmManualReject','danger','','edit')}`);break}
case 'confirmManualReject':{let reason=$('#manualRejectReason')?.value.trim();if(!reason)return toast('请输入退回原因。','error');p.manual.status='returned';log(p,'操作手册审核退回',reason);save();closeModal();render();break}
case 'exportManualDocx':makeManualFile();break;
case 'exportSourceDocx':makeSourceFile();break;
case 'printManual':printManual();break;
case 'previewEntireManual':data.manualPreview=true;route('manual');break;
case 'downloadReceipt':{const r=p.application.receipt;if(!r)return toast('暂无回执','error');textBlob(`申报回执\n软件：${p.name}\n版本：${p.version}\n任务编号：${r.ref}\n提交时间：${r.time}`,r.ref+'_申报回执.txt');break}
case 'jumpTask':{if(el.dataset.project)setProject(el.dataset.project);closeModal();route(el.dataset.route);break}
case 'closeModal':closeModal();break;
default:console.warn('Unknown action',act);toast('该操作尚未绑定演示处理：'+act,'error')
}}catch(error){console.error('UI action failed:',act,error);toast('操作出现错误：'+error.message,'error')}}
// ---- DOM events, navigation, local persistence ----
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();actionClick(a)}else if(e.target.id==='overlay')closeModal()});
document.addEventListener('input',e=>{const el=e.target,p=project();if(el.id==='projectSearch'){data.search=el.value;let tr=$('#projectRows');if(tr)tr.innerHTML=projectRows();return}if(el.matches('[data-field]')){const key=el.dataset.field,fd=FIELDS.find(f=>f.id===key);if(!fd||!canEditField(fd))return;let old=String(p.form[key]??'');if(old===el.value)return;p.form[key]=el.value;if(p.formStatus==='approved'||p.formStatus==='submitted'){p.formStatus='draft';p.formVersion++;log(p,'已核实表单发生修改','字段 '+fd.label+' 需要重新核实')}delete p.formReviews[key];ephemeral.dirtyForm=true;save();return}if(el.id==='chapterTitle'||el.id==='chapterBody'){ephemeral.manualDirty=true}});
document.addEventListener('change',async e=>{const el=e.target,p=project();if(el.id==='roleSelect'){data.role=el.value;if(!canView(p)){const first=data.projects.find(canView);if(first)data.currentId=first.id}save();render();toast('已切换演示角色。');return}if(el.id==='projectSelect'){setProject(el.value);return}if(el.id==='attachmentInput'){await handleAttachments(el.files);el.value='';return}if(el.id==='sourceInput'){await handleSourceFiles(el.files,data.sourceMode);el.value='';return}if(el.id==='chapterScreenshotInput'){chapterUploadScreenshot(el.files?.[0]);el.value='';return}if(el.id==='analysisScreenshot'){const f=el.files?.[0];if(!f)return;if(!currentChapter()){toast('请先构建手册章节，然后关联截图。','error');route('manual')}else chapterUploadScreenshot(f);el.value='';return}if(el.id==='replaceFileInput'){const existing=p.files.find(f=>f.id===el.dataset.id),file=el.files?.[0];if(!existing||!file)return;const type=existing.type;closeModal();await handleAttachments([file]);const n=p.files[0];n.type=type;n.name=existing.name;n.version=existing.version+1;n.previousId=existing.id;log(p,'文件新增版本',existing.name+' v'+n.version);save();render();toast('文件新版本已创建，旧版保留。');return}if(['ruleConfirmed','legalConfirmed'].includes(el.id)){p.application[el.id]=el.checked;save();render();return}if(el.id==='chapterTitle'||el.id==='chapterBody'){chapterInputSave(true);render();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.id==='chatQuestion'){e.preventDefault();actionClick({dataset:{action:'askRag'}})}if(e.key==='Enter'&&e.target.id==='assistantQuestion'&&!e.shiftKey){e.preventDefault();actionClick({dataset:{action:'askAssistant'}})}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(data.route==='manual'){chapterInputSave(false)}else{save();toast('草稿已保存。')}}});
function bindDropZone(id,handler){document.addEventListener('dragover',e=>{const el=e.target.closest('#'+id);if(el){e.preventDefault();el.classList.add('drag')}});document.addEventListener('dragleave',e=>{const el=e.target.closest('#'+id);if(el)el.classList.remove('drag')});document.addEventListener('drop',async e=>{const el=e.target.closest('#'+id);if(!el)return;e.preventDefault();el.classList.remove('drag');await handler(e.dataTransfer.files)})}
bindDropZone('attachmentDrop',handleAttachments);bindDropZone('sourceDrop',files=>handleSourceFiles(files,data.sourceMode));
$('#brandMark').innerHTML=icon('spark',23,1.9);$('#notiIcon').innerHTML=icon('bell',18);$('#openSidebar').innerHTML=icon('menu',19);
$('#openSidebar').addEventListener('click',()=>$('#sidebar').classList.add('visible'));$('#closeSidebar').addEventListener('click',()=>$('#sidebar').classList.remove('visible'));$('#notifications').addEventListener('click',showNotifications);
$('#showHelp')?.addEventListener('click',()=>openModal('演示工作台 · 使用说明',`<div class="alert">${icon('info',18)}<span>这是一份单 HTML 文件的完整交互原型，所有数据存在本地浏览器；项目中的示例内容均为虚构演示，不代表实际软著申报事实。</span></div><div style="height:16px"></div><div class="timeline-item"><span class="timeline-point good">1</span><div class="timeline-content"><strong>软著项目管理</strong><p>新建项目、上传/预览附件、尝试本地文本 RAG、查看历史项目与申报回执。</p></div></div><div class="timeline-item"><span class="timeline-point good">2</span><div class="timeline-content"><strong>基础信息填报</strong><p>各部门按权限填写申请信息；管理员核实字段。没有已核实的操作手册，项目仍显示材料未完成。</p></div></div><div class="timeline-item"><span class="timeline-point good">3</span><div class="timeline-content"><strong>智能材料生成</strong><p>点击“加载示例源码” → 分阶段分析 → 生成功能树与手册章节 → 逐项核验 → 管理员审核 → DOCX 下载 / PDF 打印。</p></div></div><div class="timeline-item"><span class="timeline-point good">4</span><div class="timeline-content"><strong>官网 RPA 演示</strong><p>先生成代码鉴别材料，补齐预检复选框，才能运行 RPA；模拟验证码与最终提交均需要人工确认。</p></div></div><div class="alert amber">${icon('shield',18)}<span>正式生产环境仍须接入业务 API、PostgreSQL、真实权限系统、Python FastAPI、本地模型与安全的 RPA Worker。本原型不会在浏览器里执行真实 AI 推理或官网操作。</span></div>`,`${btn('重置全部演示数据','resetDemo','danger','','refresh')}${btn('开始使用','closeModal','primary','','check')}`,true));
