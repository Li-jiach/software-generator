server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:copyright_workspace}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1
      file-size-threshold: 0
  jackson:
    time-zone: Asia/Shanghai
app:
  ai-url: ${AI_SERVICE_URL:http://127.0.0.1:8090}
  service-token: ${SERVICE_TOKEN:}
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  secure-cookie: ${SECURE_COOKIE:false}
