server:
  port: 8080
spring:
  sql:
    init:
      mode: always
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/copyright_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB
ai:
  service-url: ${AI_SERVICE_URL:http://127.0.0.1:8090}
app:
  asset-root: ${ASSET_ROOT:./data/assets}
